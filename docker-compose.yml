services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dennita_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - dennita

  nginx:
    image: nginx:alpine
    container_name: dennita_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dennita

  db:
    image: mariadb:11
    container_name: dennita_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dennita
      MYSQL_USER: dennita
      MYSQL_PASSWORD: dennita
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dennita_db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - dennita

  node:
    image: node:20-alpine
    container_name: dennita_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - dennita

networks:
  dennita:

volumes:
  dennita_db_data:
